<header class="topbar">
  <div class="topbar__start">
    <button
      type="button"
      class="topbar__menu-btn"
      aria-label="Toggle navigation"
      (click)="onMenuToggle()"
    >
      <i class="pi pi-bars"></i>
    </button>

    <div class="topbar__page-info">
      <h2>
        {{ titleKey() | translate }}
      </h2>

      <span>
        {{ subtitleKey() | translate }}
      </span>
    </div>
  </div>

  <div class="topbar__end">
    <div class="topbar-search">
      <i class="pi pi-search"></i>

      <input
        type="search"
        [placeholder]="'TOPBAR.SEARCH_PLACEHOLDER' | translate"
        [attr.aria-label]="'TOPBAR.SEARCH_PLACEHOLDER' | translate"
      />

      <span class="topbar-search__shortcut"> Ctrl K </span>
    </div>

    <div class="topbar__actions">
      <button
        type="button"
        class="topbar__action-btn topbar__language-btn"
        [attr.aria-label]="'TOPBAR.SWITCH_LANGUAGE' | translate"
        (click)="languageService.toggleLanguage()"
      >
        <i class="pi pi-language"></i>

        <span>
          {{ languageService.currentLanguage() === 'en' ? 'AR' : 'EN' }}
        </span>
      </button>

      <button
        type="button"
        class="topbar__action-btn"
        [attr.aria-label]="'TOPBAR.SWITCH_THEME' | translate"
        (click)="themeService.toggleTheme()"
      >
        <i
          class="pi"
          [class.pi-moon]="themeService.resolvedTheme() === 'light'"
          [class.pi-sun]="themeService.resolvedTheme() === 'dark'"
        ></i>
      </button>

      <button
        type="button"
        class="topbar__action-btn topbar__notification-btn"
        [attr.aria-label]="'TOPBAR.NOTIFICATIONS' | translate"
      >
        <i class="pi pi-bell"></i>

        <span class="notification-dot"></span>
      </button>

      @if (currentUser(); as user) {
        <div class="topbar-profile">
          <div class="topbar-profile__avatar">
            @if (user.image) {
              <img [src]="user.image" [alt]="user.firstName + ' ' + user.lastName" />
            } @else {
              <span>
                {{ userInitials() }}
              </span>
            }
          </div>

          <div class="topbar-profile__info">
            <strong>
              {{ user.firstName }}
            </strong>

            <span>
              {{ getRoleKey(user.role) | translate }}
            </span>
          </div>
        </div>

        <button
          type="button"
          class="topbar__action-btn topbar__logout-btn"
          [attr.aria-label]="'AUTH.LOGOUT' | translate"
          [title]="'AUTH.LOGOUT' | translate"
          (click)="logout()"
        >
          <i class="pi pi-sign-out"></i>
        </button>
      }
    </div>
  </div>
</header>
