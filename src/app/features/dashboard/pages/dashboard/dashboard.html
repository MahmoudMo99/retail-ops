<section class="dashboard-page">
  <header class="dashboard-header">
    <div class="dashboard-header__content">
      <h1>
        {{ 'DASHBOARD.TITLE' | translate }}
      </h1>

      <p>
        {{ 'DASHBOARD.SUBTITLE' | translate }}
      </p>
    </div>
  </header>

  <div class="kpi-grid">
    @for (item of kpiCards; track item.id) {
      <article class="kpi-card">
        <div class="kpi-card__top">
          <div class="kpi-card__icon" [class]="'kpi-card__icon kpi-card__icon--' + item.accent">
            <i [class]="item.icon"></i>
          </div>

          <button
            type="button"
            class="kpi-card__menu"
            [attr.aria-label]="'DASHBOARD.KPI.MORE_OPTIONS' | translate"
          >
            <i class="pi pi-ellipsis-h"></i>
          </button>
        </div>

        <div class="kpi-card__body">
          <span class="kpi-card__title">
            {{ item.title | translate }}
          </span>

          <strong class="kpi-card__value">
            {{ formatKpiValue(item) }}
          </strong>
        </div>

        <div class="kpi-card__footer">
          <span
            class="kpi-card__trend"
            [class.kpi-card__trend--positive]="item.trendType === 'positive'"
            [class.kpi-card__trend--negative]="item.trendType === 'negative'"
          >
            <i
              class="pi"
              [class.pi-arrow-up-right]="item.trendType === 'positive'"
              [class.pi-arrow-down-right]="item.trendType === 'negative'"
            ></i>

            {{ formatTrend(item.trend) }}
          </span>

          <span class="kpi-card__comparison">
            {{ item.comparison | translate }}
          </span>
        </div>
      </article>
    }
  </div>

  <div class="analytics-grid">
    <app-revenue-overview />

    <app-sales-breakdown />
  </div>

  <div class="dashboard-details-grid">
    <app-recent-orders />

    <app-top-products />
  </div>
</section>
