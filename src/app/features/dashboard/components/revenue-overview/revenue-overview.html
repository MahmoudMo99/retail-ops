<article class="analytics-card revenue-card">
  <header class="analytics-card__header">
    <div>
      <h2>
        {{ 'DASHBOARD.REVENUE.TITLE' | translate }}
      </h2>

      <p>
        {{ 'DASHBOARD.REVENUE.SUBTITLE' | translate }}
      </p>
    </div>

    <div class="revenue-summary">
      <strong>
        {{ formatter.formatCurrency(totalRevenue, 'USD', 0, 0) }}
      </strong>

      <span>
        <i class="pi pi-arrow-up-right"></i>

        {{ formatter.formatPercent(revenueGrowth, 1) }}
      </span>
    </div>
  </header>

  <div class="revenue-chart">
    <canvas #chartCanvas></canvas>
  </div>
</article>
